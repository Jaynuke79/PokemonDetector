services:
  pokemon-detector:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    expose:
      - "5000"
    volumes:
      # Mount model directory - place your model file here
      - "../models:/app/models"
    environment:
      - FLASK_DEBUG=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Public entry point; to reach the app directly, add docker-compose.direct.yml
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - "./nginx.config:/etc/nginx/nginx.conf:ro"
      # Add SSL certificates if needed
      # - "../ssl:/etc/nginx/ssl:ro"
    depends_on:
      - pokemon-detector
    restart: unless-stopped
