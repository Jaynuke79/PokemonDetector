[project]
name = "pokemondetector"
version = "0.1.0"
description = "Pokemon detection using PyTorch ConvNeXt - CLI tool and web application"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.1",
    "flask>=3.1.1",
    "gunicorn>=23.0.0",
    "pillow>=11.2.1",
    "timm>=1.0.15",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

# Cant use `uv add`, must update manually
[project.optional-dependencies]
dev = [ # Dev only dependencies
    "notebook",
    "ipykernel",
    "jupyterlab",
    "pyinstaller>=6.0.0",  # For building Windows executables
]
test = [
    "pytest>=8",
    "requests>=2.31.0",
]
desktop = [
    "pyside6-essentials==6.12.0",
]


[project.scripts]
poke = "cli.main:cli"
poke-gui = "desktop.main:main"

[tool.setuptools]
packages = ["cli", "webapp", "lib", "desktop"]

[tool.uv]
package = true
